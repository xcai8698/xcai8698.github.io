<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f4">
  <script src="../assets/theme.js"></script>
  <meta name="description" content="在这里填写文章摘要。">
  <title>文章标题 · xcai 的 AI 空间站</title>
  <link rel="stylesheet" href="../assets/site.css">
</head>
<body>
  <div class="article-shell">
    <header class="article-header">
      <a class="back-link" href="../index.html">← 返回首页</a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换到黑夜模式" aria-pressed="false" title="切换到黑夜模式">
        <span class="theme-toggle-icon" aria-hidden="true">☾</span>
        <span class="theme-toggle-label">黑夜模式</span>
      </button>
    </header>

    <main>
      <header class="article-heading">
        <p class="eyebrow">NOTE / CATEGORY</p>
        <h1>在这里填写文章标题</h1>
        <div class="article-meta">
          <time datetime="2026-11-01">2026.11.01</time>
          <span>分类名称</span>
          <span>阅读约 X 分钟</span>
        </div>
      </header>

      <article class="prose">
        <p class="article-lead">用一两句话概括这篇文章要讨论的问题，以及读者可以带走什么。</p>

        <h2>从一个问题开始</h2>
        <p>在这里写正文。可以直接使用标准 HTML：段落、标题、列表、引用、代码等。</p>

        <h2>过程与判断</h2>
        <p>记录关键背景、尝试过程、证据和判断。尽量区分已经确认的事实与仍待验证的推测。</p>
        <blockquote>在这里放一句值得记住的话，或者一个阶段性结论。</blockquote>

        <h2>结论与后续</h2>
        <ul>
          <li>结论一</li>
          <li>结论二</li>
          <li>仍待验证的问题</li>
        </ul>
      </article>
    </main>

    <footer class="article-footer">
      <a class="back-link" href="../index.html">← 回到记录索引</a>
    </footer>
  </div>
</body>
</html>
